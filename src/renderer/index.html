<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Screenshotter</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div id="titlebar">Web Screenshotter</div>
  <div id="app">
    <aside id="sidebar">
      <nav>
        <button class="nav-btn active" data-panel="capture">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.5 4.5H4a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 4 16.5h12a1.5 1.5 0 0 0 1.5-1.5V6A1.5 1.5 0 0 0 16 4.5h-3.5L11 2.5H9L7.5 4.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="10" cy="10.5" r="2.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span>Capture</span>
        </button>
        <button class="nav-btn" data-panel="queue">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4.5" width="14" height="2.5" rx="1.25" stroke="currentColor" stroke-width="1.4"/>
            <rect x="3" y="8.75" width="14" height="2.5" rx="1.25" stroke="currentColor" stroke-width="1.4"/>
            <rect x="3" y="13" width="9" height="2.5" rx="1.25" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span>Queue</span>
        </button>
        <button class="nav-btn" data-panel="history">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10 6.5V10l2.5 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>History</span>
        </button>
        <button class="nav-btn" data-panel="settings">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="7" cy="6" r="1.75" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="13" cy="10" r="1.75" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="7" cy="14" r="1.75" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span>Settings</span>
        </button>
      </nav>
    </aside>
    <main id="content">
      <div id="panel-capture" class="panel active"></div>
      <div id="panel-queue" class="panel"></div>
      <div id="panel-history" class="panel"></div>
      <div id="panel-settings" class="panel"></div>
    </main>
  </div>
  <footer id="log-area">
    <div id="log-output"></div>
  </footer>
  <script src="components/log.js"></script>
  <script src="panels/capture.js"></script>
  <script src="panels/queue.js"></script>
  <script src="panels/history.js"></script>
  <script src="panels/settings.js"></script>
  <script src="app.js"></script>
  <div id="setup-modal" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <div style="font-size:18px;font-weight:500">Setting up Web Screenshotter</div>
    <div id="setup-status" style="color:var(--text-muted);font-size:13px">Downloading browser engine...</div>
    <div style="width:300px;height:6px;background:#333;border-radius:3px">
      <div id="setup-progress" style="height:100%;background:var(--accent);border-radius:3px;width:0%;transition:width 0.3s"></div>
    </div>
    <button id="setup-retry" class="primary" style="display:none" onclick="window.api.retrySetup()">Retry</button>
  </div>
</body>
</html>
